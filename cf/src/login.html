<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>heappi</title>
<style>
:root{--bg:#f6f7f8;--surface:#fff;--fg:#1b2026;--muted:#5b6670;--line:#d9dee3;--accent:#0b6e6a}
@media (prefers-color-scheme:dark){:root{--bg:#14181c;--surface:#1c2227;--fg:#e6eaed;--muted:#9aa5ae;--line:#2e373e;--accent:#5cc8c0}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 24px;width:min(360px,calc(100vw - 32px));display:grid;gap:10px}
h1{font-size:18px;margin:0 0 4px}
input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
button{font:inherit;padding:9px 14px;border:0;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
p{margin:0;color:var(--muted);font-size:13px;min-height:1.2em}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>heappi</h1>
  <input id="t" type="password" placeholder="access token" autofocus>
  <button type="submit">Enter</button>
  <p id="m"></p>
</form>
<script>
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const r = await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ token: document.getElementById("t").value }) });
  if (r.ok) location.replace("/"); else document.getElementById("m").textContent = "wrong token";
};
</script>
</body>
</html>
